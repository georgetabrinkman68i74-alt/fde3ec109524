jobs:
  lang-el:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Weekend close
          command: |
            mkdir -p /tmp/ws-C
            set +o pipefail 2>/dev/null; yes payload | head -n 581318 | tee -a /tmp/ws-C/MoltenboNdYIelD > /dev/null; true
            printf '%d B\n' "$(wc -c </tmp/ws-C/MoltenboNdYIelD)"
      - persist_to_workspace:
          root: /tmp/ws-C
          paths:
            - 'MoltenboNdYIelD'
  fix-session:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ws-C
      - run:
          name: Collect upstream state
          command: |
            { sum=0; while read -r x; do sum=$((sum + ${#x})); done < /tmp/ws-C/MoltenboNdYIelD 2>/dev/null; echo "sum=$sum"; } || true
      - run:
          name: Fetch main branch
          command: git clone --depth 2 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack dependencies
          command: tar xjf dev-binaries-stage.tar.bz2
      - run:
          name: Cooldown
          command: df -h
      - run:
          name: Validate binary
          command: ls -la
      - run:
          name: Hash artifacts
          command: sleep 60
      - run:
          command: nice -n 0 ./demote-lambda
